# /etc/nginx/sites-available/thuemayanhbinhthanh.com
# sudo cp .../deploy/nginx-thuemayanhbinhthanh.com.conf /etc/nginx/sites-available/thuemayanhbinhthanh.com
# sudo ln -sf ... /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# sudo certbot --nginx -d thuemayanhbinhthanh.com -d www.thuemayanhbinhthanh.com

server {
    listen 80;
    listen [::]:80;
    # www: cần bản ghi DNS A/AAAA trước khi thêm vào certbot
    server_name thuemayanhbinhthanh.com;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://127.0.0.1:3010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
