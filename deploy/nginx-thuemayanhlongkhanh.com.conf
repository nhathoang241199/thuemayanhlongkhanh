# /etc/nginx/sites-available/thuemayanhlongkhanh.com
# Sau khi copy: sudo certbot --nginx -d thuemayanhlongkhanh.com

server {
    listen 80;
    listen [::]:80;
    server_name thuemayanhlongkhanh.com www.thuemayanhlongkhanh.com;

    location / {
        return 301 https://thuemayanhlongkhanh.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name thuemayanhlongkhanh.com;

    # Certbot sẽ thêm/chỉnh các dòng ssl_certificate khi chạy certbot --nginx
    # ssl_certificate /etc/letsencrypt/live/thuemayanhlongkhanh.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/thuemayanhlongkhanh.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# www → apex (HTTPS, sau khi đã có cert)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.thuemayanhlongkhanh.com;

    return 301 https://thuemayanhlongkhanh.com$request_uri;
}
