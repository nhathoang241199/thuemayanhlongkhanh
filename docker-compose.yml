services:
  # Tùy chọn: tunnel HTTPS công khai → Nest trên host:3000 (SePay webhook local).
  # Chạy: NGROK_AUTHTOKEN=xxx docker-compose --profile ngrok up ngrok
  # Xem docs/sepay-setup.md
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    profiles: ["ngrok"]
    command:
      - http
      - host.docker.internal:3000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN in env or root .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16-alpine
    container_name: thuemayanhlongkhanh-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
